name: MaPile
options:
  bundleIdPrefix: com.romandsl8
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    GOOGLE_BOOKS_API_KEY: ""
targets:
  MaPile:
    type: application
    platform: iOS
    sources:
      - path: MaPile
      - path: Shared
    dependencies:
      - target: MaPileWidgets
    info:
      path: MaPile/Info.plist
      properties:
        CFBundleDisplayName: MaPile
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.books
        ITSAppUsesNonExemptEncryption: false
        GoogleBooksAPIKey: $(GOOGLE_BOOKS_API_KEY)
        NSCameraUsageDescription: "MaPile utilise la caméra pour scanner le code-barres ISBN de vos livres et sélectionner le texte des citations."
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.romandsl8.mapile
            CFBundleURLSchemes:
              - mapile
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: MaPile/MaPile.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.romandsl8.mapile
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.romandsl8.mapile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romandsl8.mapile
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  MaPileWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: MaPile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/MaPileWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.romandsl8.mapile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romandsl8.mapile.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
