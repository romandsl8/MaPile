name: Captures d'écran

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Machine GitHub (xcode-27, ou macos-26 si indisponible)"
        default: xcode-27

jobs:
  screenshots:
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Sélection de Xcode 27+
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Génération du projet
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilation pour le simulateur
        run: |
          xcodebuild build -project MaPile.xcodeproj -scheme MaPile -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            TARGETED_DEVICE_FAMILY=1,2 CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || (grep -E "error:" build.log; tail -60 build.log; exit 1)

      - name: Captures App Store (iPhone 6,9 pouces) et grand écran
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/MaPile.app
          BUNDLE=com.romandsl8.mapile
          mkdir -p shots
          pick() {
            xcrun simctl list devices available -j | jq -r --arg re "$1" '
              .devices | to_entries[] | select(.key | test("iOS-2[6-9]")) | .value[] | select(.name | test($re)) | .udid' | head -1
          }
          IPHONE=$(pick '^iPhone 1[7-9] Pro Max$'); [ -z "$IPHONE" ] && IPHONE=$(pick '^iPhone .*Pro Max$')
          IPAD=$(pick '^iPad mini'); [ -z "$IPAD" ] && IPAD=$(pick '^iPad')
          echo "iPhone: $IPHONE / grand écran: $IPAD"

          shoot() { # device name appearance args...
            DEV=$1; NAME=$2; LOOK=$3; shift 3
            xcrun simctl ui "$DEV" appearance "$LOOK"
            xcrun simctl terminate "$DEV" $BUNDLE 2>/dev/null || true
            xcrun simctl launch "$DEV" $BUNDLE -demoData "$@"
            sleep 9
            xcrun simctl io "$DEV" screenshot "shots/$NAME.png"
          }

          prepare() { # démarre un simulateur (3 essais) et installe l'app
            for i in 1 2 3; do
              xcrun simctl boot "$1" 2>/dev/null || true
              if xcrun simctl bootstatus "$1" -b; then
                xcrun simctl status_bar "$1" override --time 9:41 --batteryState charged --batteryLevel 100 || true
                xcrun simctl install "$1" "$APP" && return 0
              fi
              xcrun simctl shutdown "$1" 2>/dev/null || true; sleep 10
            done
            return 1
          }
          prepare "$IPHONE"
          # iPad facultatif (captures grand écran) : on ne bloque pas si son simulateur refuse de démarrer.
          prepare "$IPAD" && IPAD_OK=1 || IPAD_OK=0

          shoot $IPHONE "appstore-1-pal" light -initialTab toRead
          shoot $IPHONE "appstore-2-encours" light -initialTab reading
          shoot $IPHONE "appstore-3-idees" light -initialTab reading -openNextRead YES; sleep 4; xcrun simctl io "$IPHONE" screenshot "shots/appstore-3-idees.png"
          shoot $IPHONE "appstore-4-saga" light -initialTab toRead -openFirst YES
          shoot $IPHONE "appstore-5-stats" light -initialTab stats
          shoot $IPHONE "appstore-6-lus" light -initialTab read
          shoot $IPHONE "appstore-7-sombre" dark -initialTab reading

          [ "$IPAD_OK" = 1 ] && shoot $IPAD "8-deplie-lus-fiche" light -initialTab read -openFirst YES
          [ "$IPAD_OK" = 1 ] && shoot $IPAD "9-deplie-pal-couvertures" light -initialTab toRead -openFirst YES
          [ "$IPAD_OK" = 1 ] && shoot $IPAD "10-deplie-stats" light -initialTab stats
          [ "$IPAD_OK" = 1 ] && shoot $IPAD "11-deplie-fiche-sombre" dark -initialTab read -openFirst YES
          ls -la shots
          # Rapport de plantage éventuel de l'app (diagnostic).
          CRASH=$(ls -t ~/Library/Logs/DiagnosticReports/MaPile* 2>/dev/null | head -1 || true)
          if [ -n "$CRASH" ]; then echo "=== PLANTAGE : $CRASH"; python3 .github/scripts/crash_summary.py "$CRASH" || head -c 4000 "$CRASH"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: captures
          path: shots/

  # Habillage (accroche + fond dégradé) sur Linux : ImageMagick y est rapide à installer.
  habillage:
    needs: screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: captures
          path: shots
      - name: Habillage pour l'App Store
        run: |
          command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          sudo apt-get install -y fonts-dejavu-core >/dev/null 2>&1 || true
          bash .github/scripts/frame_screenshots.sh shots appstore
      - uses: actions/upload-artifact@v4
        with:
          name: captures-appstore
          path: appstore/
