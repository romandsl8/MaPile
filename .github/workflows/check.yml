name: Vérification de compilation

# Compilation sans signature, à la demande uniquement (le build TestFlight compile déjà le code).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sélection de Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Génération du projet
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compilation (sans signature)
        run: |
          xcodebuild build -project MaPile.xcodeproj -scheme MaPile -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build.log 2>&1 || (grep -E "error:" build.log; tail -60 build.log; exit 1)
