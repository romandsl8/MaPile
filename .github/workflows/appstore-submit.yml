name: Soumettre la version à Apple

# Envoie la version à la vérification d'Apple. À lancer uniquement après accord explicite.
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Version à soumettre (ex. 1.1)"
        default: "1.1"
      confirmation:
        description: "Tapez SOUMETTRE pour confirmer"
        required: true

jobs:
  submit:
    if: inputs.confirmation == 'SOUMETTRE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Soumission
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          if echo "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            echo "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          pip install -q pyjwt cryptography
          ASC_KEY_PATH="$KEY" python3 .github/scripts/submit_version.py
