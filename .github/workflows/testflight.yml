name: Build & TestFlight

on:
  # Envoi sur TestFlight à chaque modification de l'app (Codemagic n'est plus utilisé : quota dépassé).
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "fastlane/**"
      - ".github/workflows/appstore-captures.yml"
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      HAS_SECRETS: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sélection de Xcode 27+
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[7-9]*.app | sort -V | tail -1)
          echo "Xcode utilisé : $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Génération du projet (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilation de contrôle (sans signature)
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "::warning::Secrets App Store Connect absents : compilation seule, pas d'envoi sur TestFlight."
          xcodebuild build \
            -project MaPile.xcodeproj -scheme MaPile -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build.log 2>&1 || (grep -E "error:" build.log; tail -80 build.log; exit 1)

      - name: Clé API App Store Connect
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          if echo "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            echo "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive signée
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: |
          xcodebuild archive \
            -project MaPile.xcodeproj -scheme MaPile -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MaPile.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            GOOGLE_BOOKS_API_KEY="$GOOGLE_BOOKS_API_KEY" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=$((300 + ${{ github.run_number }})) > archive.log 2>&1 || (grep -E "error:" archive.log; tail -80 archive.log; exit 1)

      - name: Vérification de la clé Google Books
        if: env.HAS_SECRETS == 'true'
        run: |
          PLIST="$RUNNER_TEMP/MaPile.xcarchive/Products/Applications/MaPile.app/Info.plist"
          KEY=$(/usr/libexec/PlistBuddy -c "Print GoogleBooksAPIKey" "$PLIST" 2>/dev/null || true)
          if [ ${#KEY} -gt 20 ]; then echo "Clé Google Books intégrée (${#KEY} caractères)"; else echo "::warning::Pas de clé Google Books dans l'app"; fi

      - name: Export et envoi sur TestFlight
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MaPile.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Build $((300 + ${{ github.run_number }})) envoyé sur TestFlight ✅"
